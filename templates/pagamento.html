<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/pagamento.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>
            Pagamento

        </h1>
    </header>
    <section class="pagamento">
        <div class="descricao-pagamento">
            <!-- texto mechan -->
             <h3>
                Garanta sua vaga já ! 
             </h3>
             <br>
             <h2>
                R$50,00
             </h2>
        </div>
        <div class="form-pagamento">
            <form action="" method="post">
                <div class="form-100">
                    <label>Email: </label>
                    <input type="text" name="email-valor" id="email-valor">
                </div>
                <div class="form-100">
                    <label>Dados do Cartão: </label>
                    <input type="text" name="dados-cart" id="dados-cart" placeholder="1234 1234 1234 1234">
                    <div class="form-50">
                        <input type="text" name="" id="" placeholder="12/26">
                        <input type="text" name="" id="" placeholder="CVC">
                    </div>
                </div><div class="form-100">
                    <input type="text" name="" id="" placeholder="Nome do Cartão">
                </div>
                <div class="form-100">
                    <input type="submit" value="Pagar!" id="pagar">
                </div>
            </form>
        </div>
    </section>
</body>
</html
